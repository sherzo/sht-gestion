[project]
name = "sht-backend"
version = "0.1.0"
description = "API de SHT Gestión (FastAPI)"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy>=2",
    "alembic",
    "psycopg[binary]",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: requiere una base de datos Postgres (DATABASE_URL)",
]
