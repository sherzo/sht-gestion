# Despliegue de la app interna y del catálogo en Cloudflare Pages al integrar en main.
# Configuración previa: docs/despliegue.md. Mientras falte CLOUDFLARE_ACCOUNT_ID, no corre.
name: Desplegar app y catálogo

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "catalog/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Construir
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL }}
        run: pnpm build

      # wrangler se ejecuta con npx: cloudflare/wrangler-action intenta instalarlo en la
      # raíz del workspace de pnpm y falla.
      - name: Publicar en Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          APP_PROJECT: ${{ vars.CF_PAGES_APP_PROJECT }}
          CATALOG_PROJECT: ${{ vars.CF_PAGES_CATALOG_PROJECT }}
        run: |
          # Crea los proyectos la primera vez; si ya existen, el error se ignora y cualquier
          # otro problema (token, cuenta) hace fallar la publicación de abajo.
          for project in "$APP_PROJECT" "$CATALOG_PROJECT"; do
            npx --yes wrangler@4 pages project create "$project" --production-branch=main \
              || echo "El proyecto $project ya existe o no se pudo crear"
          done
          npx --yes wrangler@4 pages deploy frontend/out --project-name="$APP_PROJECT" --branch=main
          npx --yes wrangler@4 pages deploy catalog/out --project-name="$CATALOG_PROJECT" --branch=main
