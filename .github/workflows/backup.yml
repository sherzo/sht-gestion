# Respaldo diario de la base de datos (RNF-06, ADR-0002): pg_dump cifrado con age y
# guardado en Cloud Storage, fuera de Supabase. El bucket borra copias de más de 30 días.
# Configuración previa: docs/despliegue.md. Mientras falte BACKUP_BUCKET, no corre.
name: Respaldo diario

on:
  schedule:
    - cron: "0 7 * * *" # 03:00 en America/Caracas
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  backup:
    if: vars.BACKUP_BUCKET != ''
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Volcar la base de datos
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        # pg_dump de la misma versión mayor que el servidor (Postgres 17).
        run: |
          docker run --rm -e BACKUP_DATABASE_URL postgres:17 \
            sh -c 'pg_dump --format=custom --no-owner --schema=public "$BACKUP_DATABASE_URL"' > backup.dump
          test -s backup.dump

      # La cuenta de despliegue solo puede crear objetos (no leerlos ni borrarlos), así que
      # se sube con la API de Cloud Storage: `gcloud storage cp` lee el objeto tras subirlo.
      # ifGenerationMatch=0 impide sobrescribir un respaldo existente.
      - name: Cifrar y subir
        env:
          AGE_PUBLIC_KEY: ${{ vars.AGE_PUBLIC_KEY }}
          BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
        run: |
          sudo apt-get install -y age > /dev/null 2>&1
          age --recipient "$AGE_PUBLIC_KEY" --output backup.dump.age backup.dump
          name="sht-$(TZ=America/Caracas date +%Y%m%d-%H%M).dump.age"
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $(gcloud auth print-access-token)" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @backup.dump.age \
            "https://storage.googleapis.com/upload/storage/v1/b/$BACKUP_BUCKET/o?uploadType=media&ifGenerationMatch=0&name=$name" \
            > /dev/null
          echo "Respaldo subido: $name ($(stat -c %s backup.dump.age) bytes)"
