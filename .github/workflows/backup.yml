# Respaldo diario de la base de datos (RNF-06, ADR-0002): pg_dump cifrado con age y
# guardado en Cloud Storage, fuera de Supabase. El bucket borra los volcados (`sht-*`) de
# más de 30 días. También copia las fotos de productos nuevas a `fotos/` (ADR-0009).
# Configuración previa: docs/despliegue.md. Mientras falte BACKUP_BUCKET, no corre.
name: Respaldo diario

on:
  schedule:
    - cron: "0 7 * * *" # 03:00 en America/Caracas
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  backup:
    if: vars.BACKUP_BUCKET != ''
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Volcar la base de datos
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        # pg_dump de la misma versión mayor que el servidor (Postgres 17).
        run: |
          docker run --rm -e BACKUP_DATABASE_URL postgres:17 \
            sh -c 'pg_dump --format=custom --no-owner --schema=public "$BACKUP_DATABASE_URL"' > backup.dump
          test -s backup.dump

      # La cuenta de despliegue solo puede crear objetos (no leerlos ni borrarlos), así que
      # se sube con la API de Cloud Storage: `gcloud storage cp` lee el objeto tras subirlo.
      # ifGenerationMatch=0 impide sobrescribir un respaldo existente.
      - name: Cifrar y subir
        env:
          AGE_PUBLIC_KEY: ${{ vars.AGE_PUBLIC_KEY }}
          BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
        run: |
          sudo apt-get install -y age > /dev/null 2>&1
          age --recipient "$AGE_PUBLIC_KEY" --output backup.dump.age backup.dump
          name="sht-$(TZ=America/Caracas date +%Y%m%d-%H%M).dump.age"
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $(gcloud auth print-access-token)" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @backup.dump.age \
            "https://storage.googleapis.com/upload/storage/v1/b/$BACKUP_BUCKET/o?uploadType=media&ifGenerationMatch=0&name=$name" \
            > /dev/null
          echo "Respaldo subido: $name ($(stat -c %s backup.dump.age) bytes)"

      # Fotos de productos (research R9, ADR-0009): copia de las fotos nuevas del bucket de
      # Supabase Storage (protocolo S3) a `fotos/`. Las fotos no cambian nunca (ruta con
      # UUIDv7): `--immutable` falla si alguna cambiara en lugar de sobrescribirla, y las que
      # se quitan del producto se conservan en el respaldo. `--checksum` compara tamaño y MD5
      # (ETag de Supabase), no la fecha: Supabase y Cloud Storage la guardan con distinta
      # precisión y `--immutable` tomaba como modificada una foto ya copiada.
      - name: Copiar las fotos de productos
        if: vars.SUPABASE_S3_ENDPOINT != ''
        env:
          RCLONE_CONFIG_SUPABASE_TYPE: s3
          RCLONE_CONFIG_SUPABASE_PROVIDER: Other
          RCLONE_CONFIG_SUPABASE_ENDPOINT: ${{ vars.SUPABASE_S3_ENDPOINT }}
          RCLONE_CONFIG_SUPABASE_REGION: ${{ vars.SUPABASE_S3_REGION }}
          RCLONE_CONFIG_SUPABASE_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_SUPABASE_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_GCS_TYPE: google cloud storage
          RCLONE_CONFIG_GCS_ENV_AUTH: "true"
          RCLONE_CONFIG_GCS_BUCKET_POLICY_ONLY: "true"
          BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
        run: |
          sudo apt-get install -y rclone > /dev/null 2>&1
          rclone copy supabase:product-photos "gcs:$BACKUP_BUCKET/fotos" \
            --immutable --checksum --gcs-no-check-bucket --stats-one-line --stats-log-level NOTICE
