# Despliegue de la API en Cloud Run al integrar en main (ADR-0002).
# Configuración previa: docs/despliegue.md. Mientras falte GCP_PROJECT_ID, no corre.
name: Desplegar API

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # Autenticación con Google Cloud sin claves (Workload Identity Federation)

jobs:
  deploy:
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/sht/api:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Construir y publicar la imagen
        run: |
          gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      # Las migraciones van antes de la nueva revisión y deben ser compatibles con la
      # versión anterior (primero agregar, después quitar; arquitectura §4.4).
      - uses: astral-sh/setup-uv@v6
      - name: Aplicar migraciones
        env:
          DATABASE_URL: ${{ secrets.MIGRATIONS_DATABASE_URL }}
        run: |
          uv sync --frozen --no-dev
          uv run alembic upgrade head

      - name: Desplegar en Cloud Run
        run: |
          gcloud run deploy sht-api \
            --image "$IMAGE" \
            --region ${{ vars.GCP_REGION }} \
            --service-account ${{ vars.GCP_RUNTIME_SA }} \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 2 \
            --cpu 1 \
            --memory 512Mi \
            --cpu-boost \
            --set-secrets DATABASE_URL=database-url:latest \
            --set-env-vars "^@^ENVIRONMENT=production@APP_VERSION=${GITHUB_SHA::7}@CORS_ORIGINS=${{ vars.CORS_ORIGINS }}"

      - name: Comprobar la API desplegada
        run: |
          url=$(gcloud run services describe sht-api --region ${{ vars.GCP_REGION }} --format='value(status.url)')
          echo "API: $url"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "$url/api/v1/health"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "$url/api/v1/health/db"
